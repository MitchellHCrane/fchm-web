name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate _redirects
        run: pnpm gen:redirects

      - name: Validate officer content
        run: pnpm validate:content

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build (static export)
        run: pnpm build

      - name: Assert per-officer redirect blocks
        run: |
          test -f public/_redirects
          grep -q "1stclasshomemortgage.com/\*" public/_redirects
