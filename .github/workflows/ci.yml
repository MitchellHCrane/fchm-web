name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate _redirects
        run: pnpm gen:redirects

      - name: Validate officer content
        run: pnpm validate:content

      - name: Subdomain guard (URL preservation)
        run: pnpm check:subdomains

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build (static export)
        run: pnpm build

      - name: Assert _redirects generated
        run: test -s public/_redirects
